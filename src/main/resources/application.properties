# ==========================================
# Viajes Carolina — Backend Configuration
# ==========================================

# HTTP & Server
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.cors.origins=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,.*
quarkus.http.cors.headers=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
quarkus.http.cors.exposed-headers=ETag,Content-Disposition,X-Total-Count
quarkus.http.cors.access-control-max-age=24H

# Database & Agroal Connection Pool
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:viajes_carolina_db}
quarkus.datasource.username=${POSTGRES_USER:postgres}
quarkus.datasource.password=${POSTGRES_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=5

# Hibernate ORM & Panache
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.statement-batch-size=25

# Flyway Database Migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.schemas=public
quarkus.flyway.table=flyway_schema_history

# SmallRye OpenAPI & Swagger UI
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.path=/api/docs
quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.info.title=Viajes Carolina API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API Hexagonal para la plataforma web pública y panel administrativo de Viajes Carolina.

# Jackson JSON Serialization
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.write-dates-as-timestamps=false

# Media Storage Configuration
viajescarolina.media.storage-dir=${MEDIA_STORAGE_DIR:../media}
viajescarolina.media.max-file-size=10485760

# Publishing & ISR Revalidation
viajescarolina.publishing.revalidation-url=${FRONTEND_REVALIDATE_URL:http://localhost:3000/api/revalidate}
viajescarolina.publishing.revalidation-secret=${REVALIDATION_SECRET:revalidation-secret-viajes-carolina-2026}
