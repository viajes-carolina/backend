# ==========================================
# Viajes Carolina — Backend Configuration
# ==========================================

quarkus.analytics.disabled=true

# HTTP & Server
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
quarkus.http.cors.headers=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
quarkus.http.cors.exposed-headers=ETag,Content-Disposition,X-Total-Count
quarkus.http.cors.access-control-max-age=24H

# Cookie de sesión admin: Secure=true por defecto (HTTPS obligatorio); se relaja solo en %dev (HTTP local).
viajescarolina.security.cookie-secure=true
%dev.viajescarolina.security.cookie-secure=false

# Database & Agroal Connection Pool
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=5

# ------------------------------------------------------------------------------
# AISLAMIENTO DE LA BASE DE DATOS EN TESTS  (perfil %test)
# ------------------------------------------------------------------------------
# La suite JAMÁS debe tocar la base de datos de desarrollo: ahí vive el contenido real
# (32 promociones, el blog, las reclamaciones) con el que el equipo valida el sitio, y
# los tests de promociones ocultan, editan y borran filas.
#
# El aislamiento se consigue POR AUSENCIA: la conexión a vc-postgres se declara solo en
# los perfiles %dev y %prod. El perfil %test no define ninguna URL JDBC, y esa ausencia
# es exactamente la condición que hace que Quarkus Dev Services levante un contenedor
# PostgreSQL efímero para la suite, con Flyway aplicando las 62 migraciones desde cero.
# Al terminar la JVM de test, Ryuk destruye el contenedor.
#
# NO añadas aquí un `quarkus.datasource.jdbc.url` sin perfil: una URL explícita gana
# sobre la que publica Dev Services y la suite pasaría a escribir en desarrollo.
# AislamientoBaseDatosTest verifica en caliente que esto sigue siendo cierto.
viajescarolina.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:viajes_carolina_db}
viajescarolina.datasource.username=${POSTGRES_USER:postgres}
viajescarolina.datasource.password=${POSTGRES_PASSWORD:postgres}

%dev.quarkus.datasource.jdbc.url=${viajescarolina.datasource.url}
%dev.quarkus.datasource.username=${viajescarolina.datasource.username}
%dev.quarkus.datasource.password=${viajescarolina.datasource.password}

%prod.quarkus.datasource.jdbc.url=${viajescarolina.datasource.url}
%prod.quarkus.datasource.username=${viajescarolina.datasource.username}
%prod.quarkus.datasource.password=${viajescarolina.datasource.password}

# Misma versión mayor que producción y que docker-compose; la imagen ya está en local.
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine
%test.quarkus.datasource.devservices.reuse=false
%test.quarkus.datasource.jdbc.min-size=2
%test.quarkus.datasource.jdbc.max-size=8

# Hibernate ORM & Panache
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.statement-batch-size=25

# Flyway Database Migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=false
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.schemas=public
quarkus.flyway.table=flyway_schema_history
# En producción: exigir checksums válidos y nunca "adoptar" un esquema preexistente sin control.
%prod.quarkus.flyway.validate-on-migrate=true
%prod.quarkus.flyway.baseline-on-migrate=false

# SmallRye OpenAPI & Swagger UI
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.path=/api/docs
quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.info.title=Viajes Carolina API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API Hexagonal para la plataforma web pública y panel administrativo de Viajes Carolina.

# Jackson JSON Serialization
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.write-dates-as-timestamps=false

# JWT Signing & Verification (SmallRye JWT) — panel admin
mp.jwt.verify.issuer=https://viajescarolina.com/issuer
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=vc_admin_jwt

# Media Storage Configuration
# Local (%dev, %test y cualquier perfil que no sea %prod): disco local, dentro del propio
# proyecto — ver LocalFileSystemStorageService (@DefaultBean).
viajescarolina.media.storage-dir=${MEDIA_STORAGE_DIR:../media}
viajescarolina.media.max-file-size=10485760
# Límite duro a nivel HTTP (defensa en profundidad, además de la validación en UploadMediaAssetUseCase)
quarkus.http.limits.max-body-size=12M
# Producción: bucket de Google Cloud Storage — ver GcsStorageService (@IfBuildProfile("prod")).
# El bucket debe existir de antemano con lectura pública a nivel de bucket (uniform bucket-level
# access + IAM allUsers:objectViewer); esta app solo sube/lee/borra objetos, no gestiona permisos.
%prod.viajescarolina.media.gcs-bucket=${MEDIA_GCS_BUCKET:viajes-carolina-media}
%prod.viajescarolina.media.gcs-public-base-url=${MEDIA_GCS_PUBLIC_BASE_URL:}

# Adjuntos del Libro de Reclamaciones (BC claims) — reutilizan el mismo MediaStorageService
# activo (local en dev, GCS en prod) vía storeRaw(), sin pasar por ImageOptimizer (puede
# llegar un PDF). 10MB por defecto.
viajescarolina.claims.attachment-max-file-size=10485760

# Publishing & ISR Revalidation
viajescarolina.publishing.revalidation-url=${FRONTEND_REVALIDATE_URL:http://localhost:3000/api/revalidate}
viajescarolina.publishing.revalidation-secret=${REVALIDATION_SECRET:revalidation-secret-viajes-carolina-2026}

# Facebook Graph API Publish — al crear una promoción desde el admin, se publica
# automáticamente como post con foto en la Página de Facebook (formato controlado,
# compuesto desde los campos estructurados). Sin credenciales configuradas o con
# publish-enabled=false, la creación funciona igual, simplemente no publica nada
# (fail-safe: no se llama a la API externa, no se produce ningún error).
viajescarolina.facebook.page-id=${FACEBOOK_PAGE_ID:}
viajescarolina.facebook.page-access-token=${FACEBOOK_PAGE_ACCESS_TOKEN:}
viajescarolina.facebook.publish-enabled=${FACEBOOK_PUBLISH_ENABLED:false}

# ------------------------------------------------------------------------------
# Servicios externos apagados en tests (perfil %test)
# ------------------------------------------------------------------------------
# Crear una promoción en un test NO debe publicar nada en la Página de Facebook real,
# aunque el .env local tenga token. Se fuerza a false y se vacían las credenciales.
%test.viajescarolina.facebook.publish-enabled=false
%test.viajescarolina.facebook.page-id=
%test.viajescarolina.facebook.page-access-token=
# Ningún test debe golpear el Next.js de desarrollo en :3000 con una revalidación ISR.
%test.viajescarolina.publishing.revalidation-url=http://127.0.0.1:9/api/revalidate
# Los archivos que suban los tests van a build/, nunca a la mediateca real de ../media.
%test.viajescarolina.media.storage-dir=build/test-media
